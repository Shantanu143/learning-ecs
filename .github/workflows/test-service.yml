name: Test Service

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            # 1. Get the code
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Install Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # 3. Install dependencies
            - name: Install dependencies
              run: npm ci

            # 5. Build the application
            - name: Build application
              run: npm run build
